description: Moveha is a student-housing and long-term rental platform for the United States,
  built to help college students and relocating professionals find, reserve, and secure off-campus
  housing before they arrive in the country. Founded by former international students and backed by
  500 Global, Moveha positions itself as an "Airbnb for long-term rentals" — a faster, more
  transparent way to browse verified properties, reserve remotely, share rooms, or list a property
  for lease, with identity-verified users. As of this enrichment pass Moveha publishes no public API
  or developer surface.
